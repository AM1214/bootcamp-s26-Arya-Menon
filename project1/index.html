<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joke Generator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body style="background-color: lightblue;">

    <div class="main_display">
        <div class="left_side">
            <h1>😂My Joke Generator😂</h1>
            <p>The one stop shop for eyeroll-worthy puns, laughs, and goofs. </p>
            <div>
                <button style="background-color: lightblue;" class="button" id="sleep">Joke About Sleep!</button>
                <button style="background-color: lightblue;" class="button" id="walk">Joke About Walking!</button>
                <button style="background-color: lightblue;" class="button" id="people">Joke About People!</button>
            </div>
        </div>
        <div class="right_side">
            <p class="joke"></p>
            <img src="https://www.reactiongifs.com/r/bst.gif" width="700px">
        </div>
    </div>
</body>
</html>
